[project]
name = "{{ project-name }}"
version = "0.1.0"
description = "{{ ProjectName }} REST service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
{% if persistence == 'PostgreSQL' %}
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
{% endif %}
{% if persistence == 'MySQL' %}
    "sqlalchemy[asyncio]>=2.0",
    "aiomysql>=0.2",
    "alembic>=1.14",
{% endif %}
{% if cache ~= 'None' %}
    "redis[asyncio]>=5.2",
{% endif %}
{% if messaging == 'Kafka' %}
    "aiokafka>=0.11",
{% endif %}
{% if messaging == 'Pulsar' %}
    "pulsar-client>=3.5",
{% endif %}
{% if has_s3 %}
    "aiobotocore[boto3]>=2.15",
{% endif %}
{% if has_azure_blob %}
    "azure-storage-blob>=12.23",
{% endif %}
]

[project.scripts]
{{ project-name }} = "{{ project_name }}.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{ project_name }}"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
